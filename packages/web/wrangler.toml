name = "maronn-auth-blog-web-production"
compatibility_date = "2025-11-17"

# 静的アセットのみを配信する Worker（Astro の output: 'static' でビルドした dist/）
[observability]
enabled = true

[assets]
directory = "dist"
not_found_handling = "404-page"

[env.production]
name = "maronn-auth-blog-web-production"

[env.production.assets]
directory = "dist"
not_found_handling = "404-page"

[[env.production.routes]]
pattern = "web.maronn-room.com"
custom_domain = true
