name: Deploy Web

on:
  push:
    branches:
      - main
    paths:
      # 記事と画像はリポジトリ内のコンテンツなので、更新時に再ビルドが必要
      - articles/**
      - images/**
      - packages/web/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
  workflow_dispatch:

concurrency:
  group: deploy-web-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # PUBLIC_SITE_URL 未設定でも本番ドメインで生成できるようにする
      # (wrangler.toml の production ルートと合わせている)
      PUBLIC_SITE_URL: ${{ vars.PUBLIC_SITE_URL || vars.PUBLIC_APP_URL || 'https://web.maronn-room.com' }}
      PUBLIC_EMBED_ORIGIN: ${{ vars.PUBLIC_EMBED_ORIGIN }}
      PUBLIC_CF_WEB_ANALYTICS_TOKEN: ${{ vars.PUBLIC_CF_WEB_ANALYTICS_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create web environment file
        run: |
          cat <<'ENVEOF' > packages/web/.env
          PUBLIC_SITE_URL=${PUBLIC_SITE_URL}
          PUBLIC_EMBED_ORIGIN=${PUBLIC_EMBED_ORIGIN}
          PUBLIC_CF_WEB_ANALYTICS_TOKEN=${PUBLIC_CF_WEB_ANALYTICS_TOKEN}
          ENVEOF

      - name: Run tests
        run: pnpm --filter @maronn-auth-blog/web test

      - name: Deploy web worker
        run: pnpm --filter @maronn-auth-blog/web deploy:production
